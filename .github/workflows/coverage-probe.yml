name: Coverage probe

# On-demand only: runs the app's real permit pipeline from a runner (open
# egress) to show per-city usable-permit counts and zero-bubble diagnostics.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the app pipeline against live city feeds
        run: |
          npx --yes esbuild@0.24.2 scripts/coverage-probe.ts \
            --bundle --platform=node --format=esm --outfile=probe.mjs \
            "--alias:@=./src" "--define:import.meta.env={}"
          node probe.mjs | tee probe-report.txt
      - name: Publish summary
        if: always()
        run: |
          echo '## Coverage probe' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -c 60000 probe-report.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
